# Netlify: builds the website that lives in /site
[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

# Built CSS, JS and fonts have a content hash in their name, so browsers can keep
# them for good. Without this Netlify makes the browser re-check every file on
# each reload, and the page paints in a fallback font while the fonts re-check.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
